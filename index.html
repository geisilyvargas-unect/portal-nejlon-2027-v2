/* CORREÇÃO V2.1: envio de rascunho independente dos handlers antigos. */
document.addEventListener('submit', function(ev) {
  if (!ev.target || ev.target.id !== 'createform') return;
  ev.preventDefault();
  ev.stopImmediatePropagation();
  const form=ev.target;
  const title=(form.elements.namedItem('title')?.value||'').trim();
  const desc=(form.elements.namedItem('desc')?.value||'').trim();
  const questions=(form.elements.namedItem('questions')?.value||'').split(/\r?\n/).map(q=>q.trim()).filter(Boolean);
  const file=form.elements.namedItem('file')?.files?.[0];
  if(!title || !questions.length){alert('Preencha o título e pelo menos uma pergunta.');return;}
  const btn=form.querySelector('button[type="submit"]');
  if(btn){btn.disabled=true;btn.textContent='Criando rascunho...';}
  try {
    const id='pauta-'+Date.now();
    const x={id,title,desc,file:file?file.name:'',questions,published:false,closed:false,
      formQuestions:[...questions.map(label=>({label,type:'vote',required:true})),
        {label:'Justifique sua decisão e insira seus pontos:',type:'textarea',required:true},
        {label:'O quão claras ficaram as opções e formas de votação?',type:'scale',required:true},
        {label:'O quanto você sentiu dificuldade na deliberação?',type:'scale',required:true},
        {label:'Como podemos melhorar?',type:'textarea',required:false}]};
    db.delibs.push(x);
    try { save(); }
    catch(storageError){db.delibs.pop();throw new Error('Não foi possível salvar no navegador. Verifique se o armazenamento local está habilitado ou se há espaço disponível. '+storageError.message);}
    state.selected=id;
    editQuestions=[];
    state.flash='Rascunho criado com sucesso! Configure o formulário e confira a planilha antes de publicar.';
    go('/prescon/editor/'+id);
  } catch(error){
    console.error('Falha ao criar rascunho:',error);
    alert('Não foi possível criar o rascunho: '+error.message);
    if(btn){btn.disabled=false;btn.textContent='Criar rascunho e gerar rotas';}
  }
},true);
</script></head><body><div class="app"><aside class="side"><div class="brand"><img class="logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbYAAAGBCAYAAAAKdpRlAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAFiUAABYlAUlSJPAAAIPLSURBVHhe7b1nfxxHluZ7MrMMABIgKUqilSElUt70SNM93Xt3+s7r+6X2q93fmtm7ZnamZ7rV01JL9AQJD1ShXJr7PCciqhLFgndVhfMvHKSLzIzMyoynTtjo1q1bhRiGYRjGlBD7qWEYhmFMBSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlRhwmYYhmFMFSZshmEYxlQR3bp1q/DzU8ev/59I4iSX2blc4riQ7bVYmhuYbomz7Uja2yJpN5IsjaTgnTjA3YiiMOOnfh/d3zAMwzhXkvn5+f/k56eOm/cjmZsXufK2yPy1QmbqsdRnIqnWcqnUCkwF00hqddH5Kqf1SCrVQioViqITscj7tUHHODOkaQcSRMMwDOP0mWqP7eY9iNo7Ive/jOXWB7HMQtQq8OC2G11pNXvS6cTSbkfSaTnPrduOpQMvTpebgnVu2utwGzy7XiFZ5g9+0LtGBSyHHV42DMMwTpSpFrYEntfVd2L57NeJPPi6IjffE7l2vZBud1t6UKssSzAP8aKQ0RoRBC+W7Y1ImpsijQ1mXXKdSGsrdwLXKaQoIskzTHORPPdTCF4B1eI80WzJvosHRi0bhmEYJ85UCxuzEuuzIm/fSeTWh5F89JXI3Y9yqc12pVpLpUihNHksaUphinRKo9j1OhGmCaaJenPq0bXo0XFaSK8FsWumWJ9La7vQ9T3uB6Nnl/LYh8EH56T/hZj4GYZhHJqpFjbCMjIKHMvZPvt1JPe/KuT6zVSuwHNL4F0lkBKWoUUaECuiQjKsyykxRQLPqwIvDSIH68Cb625D6BqFWmOjJ1vrPWms59KAh9dqMhsTYdr07EQyem/07jAt4NlxSumiV0ePTm88/5VELdD/Uqb62zEMwzh5pl7YqBbUrJk5kXfuCjy3Qj76upA7HxUyV2eFEoTxKlPEBXXIGVbnKmzOo8vg0eVpIjk8sgJeHq3bTiFk8NpaGTy3VMvo0k4FHpyoB9eBV+cskm0IoYojlntdZ5l6iu70B6asfmS6vz3DMIxDM/3C5qFXVq2KXH1X5Mvfinz8TSFvXc9lYcG5T/Db4KXhQ+FQwzK9LRhvEMUnklitWk2kUq1gXQaByyXt9SB+XUwhfL2KVjihkLW2IGhaVhfJ1ppIE8vNL const KEY='nejlon-v2-prototype-2027';const EJS={'3e':'3E',aprimora:'APRIMORA',artus:'ARTUS',bioma:'BIOMA',boson:'BÓSON',business:'BUSINESS',catecz:'CATEC’Z',consoagro:'CONSOAGRO',cotton:'COTTON',ecae:'ECAE',elo:'ELO',fertfield:'FERTFIELD',gaia:'GAIA JR',kinase:'KINASE',lex:'LEX',lion:'LION',meca:'MECA',notton:'NOTTON',paracelso:'PARACELSO',pegasus:'PEGASUS',select:'SELECT',sete:'SETE',smatjr:'SMAT JR',smartmec:'SMARTMEC',solucao:'SOLUÇÃO JR',tcp:'TCP',therion:'THERION',unect:'UNECT',vetjr:'VET JR'};const seed={delibs:[{id:'idealize-26',title:'Planejamento Financeiro — IDEALIZE 26',desc:'Análise e deliberação do planejamento financeiro do evento.',file:'[IDEALIZE 26] PLANEJAMENTO FINANCEIRO.xlsx',questions:['Você aprova o planejamento financeiro apresentado?','Você aprova a distribuição orçamentária proposta?'],published:true,closed:false},{id:'regimento',title:'Atualização do Regimento do Conselho',desc:'Revisão de diretrizes de funcionamento do Conselho.',file:'',questions:['Você aprova a atualização proposta?'],published:true,closed:false},{id:'calendario-2027',title:'Calendário Institucional 2027',desc:'Validação das datas institucionais.',file:'',questions:['Você aprova o calendário proposto?'],published:true,closed:true}],answers:[{id:'a1',delib:'idealize-26',ej:'lex',votes:['Favorável','Favorável'],manif:[{id:'m1',type:'Ressalva',q:0,body:'Solicitamos detalhamento dos custos de infraestrutura.',status:'pendente',reason:''}]},{id:'a2',delib:'idealize-26',ej:'3e',votes:['Favorável com ressalvas','Favorável'],manif:[{id:'m2',type:'Ressalva',q:0,body:'Revisar a reserva de contingência.',status:'pendente',reason:''}]},{id:'a3',delib:'idealize-26',ej:'boson',votes:['Favorável','Favorável'],manif:[{id:'m3',type:'Sugestão',q:1,body:'Adicionar comparação entre valores previstos e realizados.',status:'pendente',reason:''}]},{id:'a4',delib:'regimento',ej:'lex',votes:['Favorável'],manif:[]},{id:'a5',delib:'calendario-2027',ej:'unect',votes:['Favorável'],manif:[]},{id:'a6',delib:'calendario-2027',ej:'lex',votes:['Favorável'],manif:[]},{id:'a7',delib:'calendario-2027',ej:'3e',votes:['Favorável'],manif:[]},{id:'a8',delib:'calendario-2027',ej:'boson',votes:['Favorável'],manif:[]}]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){db=structuredClone(seed)}let state={role:'prescon',ej:'unect',selected:'idealize-26',admin:'home',report:'overview',draftVotes:{},draftManif:[],review:null,flash:''};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(db))}function d(){return db.delibs.find(x=>x.id===state.selected)||db.delibs[0]}function aa(id=d().id){return db.answers.filter(a=>a.delib===id)}function mm(id=d().id){return aa(id).flatMap(a=>a.manif.map(m=>({...m,ej:a.ej,aid:a.id})))}function answer(id,ej){return db.answers.find(a=>a.delib===id&&a.ej===ej)}function badge(x){return `<span class="pill ${x==='Aberta'?'open':x==='Encerrada'?'closed':x==='Rascunho'?'draft':x==='Aceita'?'accepted':x==='Recusada'?'rejected':''}">${esc(x)}</span>`}function status(x){return x.closed?'Encerrada':x.published?'Aberta':'Rascunho'}function hero(k,t,sub){return `<div class="hero"><div><span class="eyebrow">${k}</span><h1>${t}</h1><p>${sub}</p></div><svg class="hero-art" viewBox="0 0 180 180"><path d="M-20 160 C20 45 110 55 185 10" stroke="#c6ef32" stroke-width="37" fill="none"/><path d="M-5 170 C65 100 110 180 210 100" stroke="#f02b34" stroke-width="36" fill="none"/><path d="M130 10 L137 32 L159 39 L137 46 L130 68 L123 46 L101 39 L123 32 Z" fill="white"/></svg></div>`}function metric(n,l,c=''){return `<div class="metric ${c}"><div class="number">${n}</div><div class="label">${l}</div></div>`}function delibCards(){return `<div class="cards">${db.delibs.map(x=>`<div class="card"><div class="row">${badge(status(x))}<span class="tiny">${aa(x.id).length}/${Object.keys(EJS).length} EJs</span></div><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><div class="actions"><button class="btn" onclick="selectDelib('${x.id}','manage')">Gerenciar</button><button class="btn outline" onclick="go('/deliberar/${x.id}')">Formulário</button><button class="btn light" onclick="go('/relatorios/${x.id}')">Relatório</button></div></div>`).join('')}</div>`}function adminHome(){let open=db.delibs.filter(x=>x.published&&!x.closed).length,pend=db.delibs.reduce((s,x)=>s+mm(x.id).filter(m=>m.status==='pendente').length,0);return hero('01 / ADMINISTRAÇÃO','A REDE<br>DECIDE JUNTA.','Crie deliberações, acompanhe a participação das EJs e consolide decisões em um só lugar.')+`<div class="section"><h2>PANORAMA</h2><span class="muted">Dados demonstrativos e atualizações locais</span></div><div class="grid">${metric(db.delibs.length,'Deliberações','dark')}${metric(open,'Pautas abertas','red')}${metric(db.answers.length,'Respostas registradas')}${metric(pend,'Manifestações pendentes')}</div><div class="section"><h2>EM PAUTA</h2><button class="btn red" onclick="go('/prescon/nova')">+ Nova deliberação</button></div>${delibCards()}`}

function loginScreenRefresh(){document.getElementById('loginEjBox').style.display=loginRole==='prescon'?'none':'block'}
function doLogin(){login={role:document.getElementById('loginRole').value,ej:document.getElementById('loginEj')?.value||'unect'};sessionStorage.setItem('nejlon-login',JSON.stringify(login));state.ej=login.ej;go(login.role==='prescon'?'/prescon':login.role==='conselho'?'/deliberar/'+state.selected:'/direx/minha-ej');render()}
function logout(){sessionStorage.removeItem('nejlon-login');login=null;render()}
function initEditor(){editQuestions=[{label:'Sobre o cenário apresentado, você...',type:'vote',required:true},{label:'Justifique sua decisão e insira seus pontos:',type:'textarea',required:true},{label:'O quão claras ficaram as opções e formas de votação?',type:'scale',required:true},{label:'O quanto você sentiu dificuldade na deliberação?',type:'scale',required:true},{label:'Como podemos melhorar?',type:'textarea',required:false}];}
function getPF(x){return pfById[x.id]|| (x.id==='idealize-26'?PF_DEMO:null)}
function qInput(i){return `<div class="editor-q"><div class="row"><b>Questão ${i+1}</b><button type="button" class="btn light" onclick="removeEditorQ(${i})">Remover</button></div><div class="field"><label>Enunciado</label><input value="${esc(editQuestions[i].label)}" oninput="editQuestions[${i}].label=this.value"></div><div class="field"><label>Tipo</label><select onchange="editQuestions[${i}].type=this.value"><option value="vote" ${editQuestions[i].type==='vote'?'selected':''}>Votação (5 opções padrão)</option><option value="textarea" ${editQuestions[i].type==='textarea'?'selected':''}>Resposta longa</option><option value="scale" ${editQuestions[i].type==='scale'?'selected':''}>Escala de 0 a 5</option></select></div><label class="tiny"><input type="checkbox" ${editQuestions[i].required?'checked':''} onchange="editQuestions[${i}].required=this.checked"> Obrigatória</label></div>`}
function addEditorQ(){editQuestions.push({label:'Nova pergunta',type:'textarea',required:false});render()}
function removeEditorQ(i){editQuestions.splice(i,1);render()}
function sheetRows(pf){let names=Object.keys(pf.sheets);if(!names.includes(editorSheet))editorSheet=names[0];return `<div class="sheet-tabs">${names.map(n=>`<button type="button" class="${n===editorSheet?'active':''}" onclick="editorSheet=${JSON.stringify(n).replace(/"/g,'&quot;')};render()">${esc(n)}</button>`).join('')}</div><div class="sheet-table"><table><tbody>${pf.sheets[editorSheet].slice(0,75).map((r,i)=>`<tr><th>${i+1}</th>${r.slice(0,16).map(c=>`<td>${esc(c===null||c===undefined?'':String(c))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function pfCompare(pf){let scenarios=['PESSIMISTA','REALISTA','OTIMISTA'];let panels=Object.entries(pf.sheets).filter(([n])=>/Painel Previsão/i.test(n));return panels.length?`<div class="tablewrap"><table class="scenario-table"><thead><tr><th>Local / categoria</th>${scenarios.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${panels.flatMap(([name,rows])=>{let header=rows.findIndex(r=>r.some(v=>String(v||'').toUpperCase().includes('PESSIMISTA')));if(header<0)return [];let r=rows[header],ix=scenarios.map(sc=>r.findIndex(v=>String(v||'').toUpperCase()===sc));return rows.slice(header+1,header+14).filter(row=>row.some((v,j)=>ix.includes(j)&&typeof v==='number')).map(row=>`<tr><td>${esc(name+' / '+String(row[1]||row[0]||'Categoria'))}</td>${ix.map(j=>`<td>${typeof row[j]==='number'?row[j].toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—'}</td>`).join('')}</tr>`)}).join('')}</tbody></table></div>`:'<div class="notice">Nenhum painel de cenários identificado automaticamente. Confira as abas antes de publicar.</div>'}
function editorPage(){let x=d(),pf=getPF(x);if(!editQuestions.length)initEditor();return hero('03 / PRESCON · EDITOR','FORMULÁRIO<br>INTELIGENTE.','Modelo padrão editável, cenários financeiros e prévia para o Conselho.')+`<div class="section"><h2>${esc(x.title)}</h2>${badge(status(x))}</div><div class="actions"><span class="step">1 · Planilha</span><span class="step">2 · Perguntas</span><span class="step">3 · Publicação</span></div><div class="editor-grid" style="margin-top:15px"><div class="card"><h3>01 / Planilha do PF</h3><p>Arquivo associado: <b>${esc(pf?.name||x.file||'Nenhum')}</b></p><div class="field"><label>Enviar XLSX do planejamento</label><input type="file" accept=".xlsx,.xls" onchange="readPF(this.files[0])"></div><p class="tiny">O arquivo enviado será interpretado no navegador quando a biblioteca de leitura estiver disponível. O exemplo IDEALIZE já contém uma prévia de dados extraídos do XLSX original.</p>${pf?`<h3>Comparativo de cenários</h3>${pfCompare(pf)}<h3>Visualização das abas</h3>${sheetRows(pf)}<button class="btn outline" onclick="downloadPF()">Baixar XLSX vinculado</button>`:'<div class="notice">Envie um XLSX para comparar os cenários e exibir as abas.</div>'}</div><div class="card"><h3>02 / Editor do formulário</h3><p>Estrutura do Google Forms padrão. As perguntas podem ser editadas antes da publicação.</p><div class="field"><label>Título da deliberação</label><input id="editTitle" value="${esc(x.title)}"></div><div class="field"><label>Texto de apresentação</label><textarea id="editDesc">${esc(x.desc)}</textarea></div><div id="editorQuestions">${editQuestions.map((q,i)=>qInput(i)).join('')}</div><div class="actions"><button class="btn light" onclick="addEditorQ()">+ Pergunta</button><button class="btn red" onclick="saveEditor()">Salvar formulário</button></div><div class="line"></div><h3>03 / Publicação</h3><button class="btn red" onclick="saveEditor();publish('${x.id}')">Salvar e publicar</button><button class="btn outline" onclick="go('/deliberar/${x.id}')">Prévia do Conselho</button><button class="btn outline" onclick="go('/relatorios/${x.id}')">Relatório</button></div></div>`}
function saveEditor(){let x=d();x.title=document.getElementById('editTitle')?.value||x.title;x.desc=document.getElementById('editDesc')?.value||x.desc;x.formQuestions=structuredClone(editQuestions);x.questions=editQuestions.filter(q=>q.type==='vote').map(q=>q.label);if(!x.questions.length)x.questions=['Você aprova o cenário apresentado?'];save();state.flash='Formulário salvo. As perguntas e o relatório continuam vinculados à deliberação.';render()}
async function readPF(file){if(!file)return; if(typeof XLSX==='undefined'){alert('A biblioteca XLSX não carregou. Conecte-se à internet para importar esta planilha.');return}try{let wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});let sheets={};wb.SheetNames.forEach(n=>{sheets[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}).slice(0,120)});pfById[d().id]={name:file.name,sheets,blob:await file.arrayBuffer()};d().file=file.name;save();state.flash='XLSX importado e comparativos atualizados. Confira os valores antes de publicar.';render()}catch(e){alert('Falha ao interpretar XLSX: '+e.message)}}
function downloadPF(){let pf=getPF(d());if(!pf?.blob){alert('O arquivo original não está incorporado nesta prévia. Envie o XLSX no editor para baixar o mesmo arquivo.');return}let a=document.createElement('a'),u=URL.createObjectURL(new Blob([pf.blob]));a.href=u;a.download=pf.name;a.click();URL.revokeObjectURL(u)}
function formExtras(x){let qs=x.formQuestions||[];return `<div class="formlook"><div class="card"><h3>Formulário padrão de deliberação</h3><p>Preencha os dados e consulte o planejamento financeiro antes de deliberar.</p><p><b>Opções:</b> Aprova · Aprova com sugestões · Aprova com ressalvas · Reprova · Abstem</p></div><div class="card"><div class="field"><label>E-mail *</label><input type="email" id="respEmail" placeholder="seuemail@exemplo.com"></div><div class="field"><label>Nome completo *</label><input id="respName" placeholder="Nome da conselheira"></div><p class="tiny">EJ: ${esc(EJS[state.ej])}</p></div>${getPF(x)?`<div class="card"><h3>Planejamento financeiro vinculado</h3><p>Prévia das abas e comparação entre cenários</p>${pfCompare(getPF(x))}${sheetRows(getPF(x))}</div>`:''}<div class="card"><h3>Considerações finais</h3><div class="field"><label>Clareza das opções (0–5)</label><select id="clarity">${[0,1,2,3,4,5].map(i=>`<option value="${i}">${i}</option>`).join('')}</select></div><div class="field"><label>Dificuldade da deliberação (0–5)</label><select id="difficulty">${[0,1,2,3,4,5].map(i=>`<option value="${i}">${i}</option>`).join('')}</select></div><div class="field"><label>Como podemos melhorar?</label><textarea id="improve"></textarea></div></div></div>`}

const oldRender=render;render=function(){oldRender();if(!login){document.body.insertAdjacentHTML('beforeend',loginScreen());return}document.querySelectorAll('.loginwall').forEach(e=>e.remove());document.getElementById('persona').innerHTML=esc(login.role==='prescon'?'PRESCON DO NÚCLEO':login.role==='conselho'?'CONSELHO · '+EJS[login.ej]:'DIREX · '+EJS[login.ej])+' <button class="btn light" onclick="logout()" style="margin-left:10px">Sair</button>';let path=location.hash.slice(1);if(path.startsWith('/prescon/editor/')){document.getElementById('root').innerHTML=editorPage()}else if(path.startsWith('/deliberar/')){let x=d();let root=document.getElementById('root');let target=root.querySelector('#voteform');if(target){target.insertAdjacentHTML('afterbegin',formExtras(x));target.querySelectorAll('input[type=radio]').forEach(r=>{if(r.value==='Favorável')r.nextSibling.textContent=' Aprova';if(r.value==='Favorável com ressalvas')r.nextSibling.textContent=' Aprova com ressalvas';if(r.value==='Contrário')r.nextSibling.textContent=' Reprova';if(r.value==='Abstenção')r.nextSibling.textContent=' Abstem'});}}if(login.role==='direx'&&!path.startsWith('/direx/')){document.getElementById('root').innerHTML='<div class="notice">A Direx EJ pode consultar somente o status da própria EJ. <button class="btn" onclick="go(\'/direx/minha-ej\')">Meu acompanhamento</button></div>'}if(login.role==='conselho'&&(path.startsWith('/prescon')||path.startsWith('/relatorios'))){document.getElementById('root').innerHTML='<div class="notice">Esta área não está disponível para o perfil Conselho nesta demonstração.</div>'}};

/* V2.3 — Formulário padrão, editor PRESCON e URL independente para Conselho */
const PADRAO_V23=[
 {type:'vote',label:'Sobre o cenário apresentado, você...',required:true},
 {type:'textarea',label:'Justifique a sua decisão e insira seus pontos:',required:true},
 {type:'scale',label:'O quão claras ficaram as opções e as formas de votação?',required:true},
 {type:'scale',label:'O quanto você sentiu dificuldade na deliberação?',required:true},
 {type:'textarea',label:'Como podemos melhorar?',required:false}
];
let v23Questions=[],v23EditingId=null;
function v23Qs(x){return x.formQuestions?.length?x.formQuestions:PADRAO_V23.map(q=>({...q}))}
function v23Init(x){if(v23EditingId!==x.id){v23EditingId=x.id;v23Questions=JSON.parse(JSON.stringify(v23Qs(x)))}}
function v23Editor(){const x=d();v23Init(x);
 return hero('PRESCON / EDITOR','FORMULÁRIO<br>PADRÃO.','A PRESCON edita. O Conselho visualiza somente a versão de participante.')+
 `<div class="section"><h2>${esc(x.title)}</h2>${badge(status(x))}</div>
 <div class="card"><h3>Formulário padrão · modelo institucional</h3>
 <p>Estrutura baseada no PDF de seis páginas: identificação, instruções, planilha, votação com cinco opções, justificativa e considerações finais.</p>
 <div class="actions"><button class="btn outline" onclick="go('/deliberar/${x.id}')">Visualizar como participante ↗</button><button class="btn outline" onclick="copyLink('/deliberar/${x.id}')">Copiar URL do formulário</button><button class="btn outline" onclick="go('/prescon/editor/${x.id}')">Análise do XLSX / PF</button></div>
 <div class="field"><label>Título</label><input id="v23Title" value="${esc(x.title)}"></div>
 <div class="field"><label>Apresentação / contexto</label><textarea id="v23Desc">${esc(x.desc||'')}</textarea></div>
 <h3>Identificação obrigatória</h3><p class="tiny">E-mail, nome completo e EJ são campos fixos do modelo; a EJ é vinculada ao login do Conselho.</p>
 <h3>Perguntas editáveis</h3><div id="v23QuestionList">${v23Questions.map((q,i)=>`
 <div class="editor-q"><div class="row"><b>${i+1}. ${q.type==='vote'?'Votação':q.type==='scale'?'Escala 0–5':'Resposta longa'}</b><button class="btn light" type="button" onclick="v23Remove(${i})">Remover</button></div>
 <div class="field"><label>Enunciado</label><input value="${esc(q.label)}" oninput="v23Questions[${i}].label=this.value"></div>
 <div class="field"><label>Tipo de campo</label><select onchange="v23Questions[${i}].type=this.value"><option value="vote" ${q.type==='vote'?'selected':''}>Votação — cinco opções oficiais</option><option value="textarea" ${q.type==='textarea'?'selected':''}>Texto longo</option><option value="scale" ${q.type==='scale'?'selected':''}>Escala 0 a 5</option></select></div>
 <label class="tiny"><input type="checkbox" ${q.required?'checked':''} onchange="v23Questions[${i}].required=this.checked"> Obrigatória</label></div>`).join('')}</div>
 <div class="actions"><button class="btn light" type="button" onclick="v23Add()">+ Adicionar pergunta</button><button class="btn red" type="button" onclick="v23Save()">Salvar formulário</button></div>
 <div class="line"></div><p><b>Arquivo financeiro vinculado:</b> ${esc(x.file||'Nenhum XLSX vinculado')}</p>
 <p class="tiny">A planilha permanece associada à deliberação e será disponibilizada na visão participante quando o arquivo estiver carregado nesta sessão.</p>
 <button class="btn outline" onclick="go('/prescon/editor/${x.id}')">Abrir editor financeiro / XLSX</button>
 </div>`}
function v23Add(){v23Questions.push({label:'Nova pergunta',type:'textarea',required:false});render()}
function v23Remove(i){v23Questions.splice(i,1);render()}
function v23Save(){let x=d();let title=document.getElementById('v23Title')?.value.trim();if(!title||v23Questions.some(q=>!q.label.trim()))return alert('Preencha o título e os enunciados.');
 if(!v23Questions.some(q=>q.type==='vote'))return alert('Inclua pelo menos uma pergunta de votação.');
 x.title=title;x.desc=document.getElementById('v23Desc')?.value||'';x.formQuestions=JSON.parse(JSON.stringify(v23Questions));x.questions=v23Questions.filter(q=>q.type==='vote').map(q=>q.label);
 save();state.flash='Formulário padrão salvo. O Conselho já vê a versão atualizada na URL de participante.';render()}
function v23Rules(){return `<div class="card" style="border-top:7px solid #f02b34"><h2>Como funciona a votação</h2>
 <p><b>APROVO:</b> concorda integralmente com o documento.</p>
 <p><b>APROVO COM SUGESTÕES:</b> concorda com o documento, mas propõe melhorias. O voto conta como aprovação.</p>
 <p><b>APROVO COM RESSALVAS:</b> a aprovação depende de condição. Se a PRESCON aceitar a ressalva, conta como aprovação; se recusar, como reprovação.</p>
 <p><b>REPROVA:</b> não aprova a proposta; deve justificar.</p>
 <p><b>ABSTENHO:</b> opta por não votar.</p></div>`}
function v23Participant(){let x=d(), existing=answer(x.id,login?.ej||state.ej),qs=v23Qs(x),isOpen=x.published&&!x.closed;
 let html=hero('CONSELHO / FORMULÁRIO','SUA VOZ<br>DECIDE.','Formulário padrão de deliberação · somente leitura da estrutura e envio de respostas.')+
 `<div class="formlook"><div class="card" style="border-top:9px solid #f02b34"><h1>Deliberação — ${esc(x.title)}</h1><p>Falaaaa conselheiro pé vermelho! ❤️</p><p>${esc(x.desc||'Este formulário é responsável pela deliberação da pauta apresentada.')}</p><p>Leia as orientações antes de registrar sua decisão.</p></div>
 ${v23Rules()}<div class="card"><h3>Identificação</h3><p class="tiny">Empresa júnior vinculada ao acesso: <b>${esc(EJS[login?.ej]||'—')}</b></p></div>`;
 if(existing)return html+`<div class="card"><h2>Resposta enviada ✓</h2><p>A participação da sua EJ já foi registrada nesta deliberação.</p></div></div>`;
 if(!isOpen)return html+`<div class="card"><h3>${x.closed?'Deliberação encerrada':'Aguardando publicação da PRESCON'}</h3></div></div>`;
 html+=`<form id="v23Response" class="card"><div class="field"><label>E-mail *</label><input name="email" type="email" required placeholder="nome@exemplo.com"></div><div class="field"><label>Nome completo *</label><input name="name" required placeholder="Nome da pessoa conselheira"></div><div class="field"><label>EJ *</label><input readonly value="${esc(EJS[login?.ej]||'EJ vinculada ao acesso')}"></div>
 <div class="line"></div><h3>Planejamento financeiro</h3><p>${esc(x.file||'Nenhuma planilha vinculada.')}</p><div class="actions"><button type="button" class="btn outline" onclick="v23OpenPF()">Visualizar planilha / abas</button><button type="button" class="btn light" onclick="v23DownloadPF()">Baixar XLSX, se disponível</button></div><div id="v23PFViewer"></div>
 <div class="line"></div><h3>Deliberação</h3>`;
 qs.forEach((q,i)=>{html+=`<div class="editor-q"><label><b>${i+1}. ${esc(q.label)} ${q.required?'*':''}</b></label>`;
 if(q.type==='vote'){html+=`<div style="display:grid;gap:10px;margin-top:13px">${VOTES.map(v=>`<label style="display:flex;gap:9px;align-items:center"><input type="radio" name="v23q${i}" value="${esc(v)}" ${q.required?'required':''}> ${esc(v)}</label>`).join('')}</div><p class="tiny">Sugestões e ressalvas devem ser explicadas na justificativa correspondente.</p>`}
 else if(q.type==='scale'){html+=`<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:13px">${[0,1,2,3,4,5].map(n=>`<label><input type="radio" name="v23q${i}" value="${n}" ${q.required?'required':''}> ${n}</label>`).join('')}</div>`}
 else html+=`<textarea name="v23q${i}" ${q.required?'required':''} placeholder="Escreva sua resposta..." style="margin-top:10px"></textarea>`;
 html+='</div>'});
 html+=`<button type="submit" class="btn red">Enviar deliberação</button></form></div>`;return html}
function v23OpenPF(){let x=d(),pf=getPF(x),box=document.getElementById('v23PFViewer');if(!pf){box.innerHTML='<div class="notice">A planilha ainda não está disponível para visualização nesta sessão.</div>';return}
 box.innerHTML='<div class="notice"><b>Prévia financeira vinculada</b></div>'+pfCompare(pf)+sheetRows(pf)}
function v23DownloadPF(){downloadPF()}
function v23Submit(ev){ev.preventDefault();let x=d(),qs=v23Qs(x),fd=new FormData(ev.target),values=qs.map((q,i)=>String(fd.get('v23q'+i)||'').trim());
 if(qs.some((q,i)=>q.required&&!values[i]))return alert('Responda todas as perguntas obrigatórias.');
 let voteIndexes=qs.map((q,i)=>q.type==='vote'?i:-1).filter(i=>i>=0);
 let votes=voteIndexes.map(i=>values[i]);
 let manifests=[];
 voteIndexes.forEach((qi,j)=>{let v=values[qi];if(v==='Aprova com sugestões'||v==='Aprova com ressalvas'){let next=qs.findIndex((q,k)=>k>qi&&q.type==='textarea');let body=next>=0?values[next]:'';if(!body.trim())return;manifests.push({id:'m'+Date.now()+'-'+j,type:v==='Aprova com sugestões'?'Sugestão':'Ressalva',q:j,body,status:'pendente',reason:''})}});
 if(votes.some((v,j)=>(v==='Aprova com sugestões'||v==='Aprova com ressalvas')&&!manifests.some(m=>m.q===j)))return alert('Explique suas sugestões ou ressalvas no campo de justificativa.');
 if(answer(x.id,login.ej))return alert('Esta EJ já enviou uma resposta.');
 let scales=qs.map((q,i)=>q.type==='scale'?values[i]:null).filter(v=>v!==null);
 let texts=qs.map((q,i)=>q.type==='textarea'?values[i]:null).filter(v=>v!==null);
 db.answers.push({id:'a'+Date.now(),delib:x.id,ej:login.ej,votes,manif:manifests,email:fd.get('email'),name:fd.get('name'),clarity:scales[0]||'',difficulty:scales[1]||'',improve:texts.at(-1)||'',formResponses:values,formSnapshot:qs});
 save();state.flash='Resposta registrada! A Direx verá o status e a PRESCON poderá analisar as manifestações.';render()}

render=function(){v23PreviousRender();if(!login)return;let path=location.hash.slice(1),root=document.getElementById('root');if(!root)return;
 if(path.startsWith('/prescon/formulario/')){if(login.role!=='prescon'){root.innerHTML='<div class="notice">Somente a PRESCON do Núcleo pode editar o formulário.</div>';return}root.innerHTML=v23Editor()}
 if(path.startsWith('/deliberar/')){if(login.role!=='conselho'&&login.role!=='prescon'){root.innerHTML='<div class="notice">Somente o Conselho pode deliberar.</div>';return}

};
